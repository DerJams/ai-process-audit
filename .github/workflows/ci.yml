name: CI

# The engine is developed on Windows ARM64, where WeasyPrint cannot load the native
# libraries it needs and the PDF path therefore cannot be exercised. This workflow
# exists so that path is genuinely tested somewhere. Ubuntu has the libraries in apt,
# so the PDF is produced here, checked, and uploaded as an artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and PDF on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the native libraries WeasyPrint needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz-subset0 \
            libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm WeasyPrint can actually load
        run: python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Validate every synthetic intake
        run: |
          for intake in eval/intakes/*.json; do
            python -m ai_process_audit validate "$intake"
          done

      - name: Run the full pipeline over every synthetic intake
        run: |
          for intake in eval/intakes/*.json; do
            name=$(basename "$intake" .json)
            python -m ai_process_audit report "$intake" --out "out/$name" --date 2026-01-01
          done

      - name: Check a PDF was produced for every intake
        # The whole point of this job. If WeasyPrint silently stopped rendering, the
        # report command would still succeed, because it is built to degrade rather
        # than fail. So the PDF is checked for here instead.
        run: |
          missing=0
          for intake in eval/intakes/*.json; do
            name=$(basename "$intake" .json)
            pdf="out/$name/report.pdf"
            if [ ! -s "$pdf" ]; then
              echo "No PDF produced at $pdf"
              missing=1
            else
              echo "$pdf is $(stat -c%s "$pdf") bytes"
            fi
          done
          exit $missing

      - name: Check the reports carry the disclosure
        run: |
          for intake in eval/intakes/*.json; do
            name=$(basename "$intake" .json)
            grep -q "generated by an AI system" "out/$name/report.md"
            grep -q "stub judge" "out/$name/report.md"
          done

      - name: Run the eval harness
        # Passes with no labels written. It reports zero labels compared rather than
        # inventing any, and this step exists to prove it stays that way.
        run: python -m eval.harness

      - uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            out/**/report.pdf
            out/**/report.html
            out/**/report.md
            out/**/maps/*.mmd
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: eval/out/
          if-no-files-found: error
